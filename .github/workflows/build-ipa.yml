name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned iOS IPA
        run: |
          VERSION="0.2.7"
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          xcodebuild -workspace ios/CodaIOS.xcworkspace -scheme CodaIOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build
          APP="$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/CodaIOS.app"
          mkdir -p "$RUNNER_TEMP/payload/Payload" dist
          cp -R "$APP" "$RUNNER_TEMP/payload/Payload/"
          (cd "$RUNNER_TEMP/payload" && zip -qry "$GITHUB_WORKSPACE/dist/Coda-iOS-$VERSION.ipa" Payload)
          ls -la dist/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Coda-iOS-unsigned
          path: dist/*.ipa
